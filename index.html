<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffebee;
            font-family: 'Indie Flower', cursive; /* Handwritten style */
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d32f2f;
            font-size: 3rem;
            margin-bottom: 10px;
            padding: 0 20px;
        }

        .gif-container img {
            width: 250px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            position: relative; /* Needed for absolute positioning context */
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Indie Flower', cursive;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
        }
        
        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #f50057;
        }

        #noBtn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute; /* Allows it to move freely */
        }
    </style>
</head>
<body>

    <audio id="valentineMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="gif-container">
            <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzAmbGl2ZT1mYWxzZQ/MDJ9uLGiTLvDpYkhwH/giphy.gif" alt="Cute Bear">
        </div>
        
        <h1 id="question">Will you be mine forever?</h1>
        
        <div class="buttons">
            <button id="noBtn">No</button>
            <button id="yesBtn" style="margin-left: 100px;">Yes</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionText = document.getElementById('question');
        const mainGif = document.getElementById('mainGif');
        const music = document.getElementById('valentineMusic');

        // 1. PERSONALIZATION LOGIC
        // This checks the URL for ?name=bubu
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('bubu');
        if (name) {
            questionText.innerText = `Will you be mine forever, ${Satya}? 🌹`;
        }

        // 2. THE DANCING "NO" BUTTON LOGIC
        // Works on Mouse (Desktop) and Touch (Mobile)
        function moveButton() {
            // Get window dimensions
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Calculate random position
            // We keep it within 80% of the screen so it doesn't disappear
            const newX = Math.random() * (width - noBtn.offsetWidth) - (width / 2);
            const newY = Math.random() * (height - noBtn.offsetHeight) - (height / 2);

            // Apply movement using Transform to keep it relative to the container
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${Math.random() * 80 + 10}%`;
            noBtn.style.top = `${Math.random() * 80 + 10}%`;
        }

        noBtn.addEventListener('mouseover', moveButton); // For PC cursor
        noBtn.addEventListener('touchstart', moveButton); // For Mobile tap

        // 3. THE "YES" CELEBRATION
        yesBtn.addEventListener('click', () => {
            // A. Change the content
            questionText.innerHTML = `YAY! I love you ${name ? name : ''}! ❤️`;
            mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzB4ZzAmbGl2ZT1mYWxzZQ/KztT2c4u8mYYUiMKdJ/giphy.gif";
            
            // B. Hide buttons
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';

            // C. Play Music (Browsers allow audio only after interaction)
            music.play();

            // D. Trigger Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            
            // Keep shooting confetti for a few seconds
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            
                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
